<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color: blue;
            background: yellow;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Cách 1: inline style--> 
    <!--color : quy định màu chữ-->
    <!--background : quy định màu nền-->
    <h1 style="color: rgb(206, 218, 40); background: rgb(179, 24, 168);">
    Bài Style  
    </h1>
    <!--cách 2: internal style-->
    <h2>Cách 2 Internal Style</h2>
    <h3>Cách 2 External Style</h3>
</body>
</html>
