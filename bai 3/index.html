                <!-- mặc định là text -->
                <!-- thuộc tính readonly sử dụng khi -->
                <!-- không muốn người dùng nhập -->
                <!-- thông tin vào input-->
                <input type="text" placeholder="Nhập họ và tên">          
            </div>
            <div>
                <b>Mật khẩu:</b><br>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>

                <textarea>Nhập thông tin...</textarea>

                <input type="email">
            </div>
            <div>
                <b>Số điện thoại:</b><br>

            </div>

            </div>
